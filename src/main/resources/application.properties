spring.application.name=bakery-shop


# H2 File-based Database Configuration with Automatic Mixed Mode (prevents file locking conflicts)
spring.datasource.url=jdbc:h2:file:./data/bakerydb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Spring Data JPA settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console Settings (To view database via browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configure all three properties to provision the initial administrator account.
# Passwords are stored as salted PBKDF2 hashes.
app.admin.username=
app.admin.email=
app.admin.password=

# Invoice email. Supply credentials as environment variables, never in Git.
# Email stays disabled until configured; invoice downloads still work.
app.invoice-email.enabled=${INVOICE_EMAIL_ENABLED:false}
app.invoice-email.from=${MAIL_FROM:}
app.invoice-email.poll-delay-ms=5000
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend catalogue uses the reviewed ItemService file persistence.
app.items.file=data/website-items.txt
app.website.seed-catalogue=true
server.error.include-message=always
server.error.include-stacktrace=never
